name: FRET to Ogma native translation spike

on:
  push:
    branches:
      - research/fret-ogma-native-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-translate:
    if: "${{ !contains(github.event.head_commit.message, 'ci: isolated GHC control') && !contains(github.event.head_commit.message, 'ci: full monitor') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout FRET research branch
        uses: actions/checkout@v4

      - name: Checkout exact Ogma source revision
        uses: actions/checkout@v4
        with:
          repository: nasa/ogma
          ref: 08b384b4335cce324fac74577adc7f08e61b7cce
          path: ogma-source

      - name: Install EJS for the pinned FRET export templates
        run: npm install --no-audit --no-fund --no-save --prefix research/fret-ogma-native ejs@3.1.9

      - name: Source-execute FRET's Copilot export (four controlled inputs)
        run: node research/fret-ogma-native/export-regression.mjs

      - name: Configure Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.14'

      - name: Install native Ogma prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libexpat1-dev z3 alex happy binutils binutils-gold
          command -v ld
          command -v ld.gold
          cabal update

      - name: Build pinned Ogma executable
        working-directory: ogma-source
        run: cabal build ogma-cli:exe:ogma --jobs=2

      - name: Translate all four FRET exports with Ogma standalone
        shell: bash
        working-directory: ogma-source
        run: |
          mkdir -p ../research/fret-ogma-native/out/native
          for scenario in sensor-mapped sensor-unmapped fsm-mapped fsm-unmapped; do
            mkdir -p "../research/fret-ogma-native/out/native/$scenario"
            set +e
            cabal run ogma-cli:exe:ogma -- standalone \
              --input-format fcs \
              --prop-format smv \
              --input-file "../research/fret-ogma-native/out/$scenario.json" \
              --target-dir "../research/fret-ogma-native/out/native/$scenario/generated" \
              > "../research/fret-ogma-native/out/native/$scenario/ogma.log" 2>&1
            code=$?
            set -e
            echo "$code" > "../research/fret-ogma-native/out/native/$scenario/exit-code.txt"
            echo "=== $scenario: Ogma exit code $code ==="
            tail -n 30 "../research/fret-ogma-native/out/native/$scenario/ogma.log"
            grep -RIn --include='*.hs' -F ':: Stream (_)' "../research/fret-ogma-native/out/native/$scenario/generated" || true
          done

      - name: Upload source-exported specimens and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fret-ogma-native-spike
          path: research/fret-ogma-native/out/
          if-no-files-found: warn

  isolated-ghc-control:
    if: "${{ contains(github.event.head_commit.message, 'ci: isolated GHC control') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout exact Ogma source revision for format assertions
        uses: actions/checkout@v4
        with:
          repository: nasa/ogma
          ref: 08b384b4335cce324fac74577adc7f08e61b7cce
          path: ogma-source

      - name: Install EJS for the source-executed FRET UI-default probe
        run: npm install --no-audit --no-fund --no-save --prefix research/fret-ogma-native ejs@3.1.9

      - name: Recreate UI-initialized exports and compare exact native-run input bytes
        run: |
          node research/fret-ogma-native/export-regression.mjs
          printf '%s  %s\n' \
            '5b11e0de630e4db120e3ceff34330cdcf19ee52a177df7d2c2806dc45f013de7' \
            'research/fret-ogma-native/out/sensor-unmapped.json' | sha256sum -c -
          printf '%s  %s\n' \
            'cdca32ab8320a82deb90456e5b3470c8ca8a77e0defb82ef6f49939ce5848842' \
            'research/fret-ogma-native/out/sensor-mapped.json' | sha256sum -c -

      - name: Retrieve native Ogma output from the pinned green generation run
        uses: actions/download-artifact@v4
        with:
          name: fret-ogma-native-spike
          run-id: 41241267388
          github-token: ${{ github.token }}
          path: research/fret-ogma-native/out

      - name: Configure GHC (no dependency build)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.14'
          cabal-update: false

      - name: Extract actual generated declarations with minimal Stream stub
        run: node research/fret-ogma-native/typecheck-generated.mjs

      - name: GHC type check the mapped control and unmapped test
        shell: bash
        run: |
          set +e
          ghc -fforce-recomp -fno-code \
            research/fret-ogma-native/out/ghc-minimal/SensorMapped.hs \
            > research/fret-ogma-native/out/ghc-minimal/mapped.log 2>&1
          mapped_code=$?
          ghc -fforce-recomp -fno-code \
            research/fret-ogma-native/out/ghc-minimal/SensorUnmapped.hs \
            > research/fret-ogma-native/out/ghc-minimal/unmapped.log 2>&1
          unmapped_code=$?
          set -e
          echo "mapped GHC exit: $mapped_code"
          echo "unmapped GHC exit: $unmapped_code"
          sed -n '1,60p' research/fret-ogma-native/out/ghc-minimal/mapped.log
          sed -n '1,100p' research/fret-ogma-native/out/ghc-minimal/unmapped.log
          test "$mapped_code" -eq 0
          test "$unmapped_code" -ne 0
          grep -q 'Found type wildcard' research/fret-ogma-native/out/ghc-minimal/unmapped.log

      - name: Save isolated GHC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fret-ogma-isolated-ghc-control
          path: research/fret-ogma-native/out/ghc-minimal/
          if-no-files-found: warn

  full-generated-monitor-ghc:
    if: "${{ contains(github.event.head_commit.message, 'ci: full monitor') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Retrieve both complete pinned Ogma-generated monitors
        uses: actions/download-artifact@v4
        with:
          name: fret-ogma-native-spike
          run-id: 41241267388
          github-token: ${{ github.token }}
          path: research/fret-ogma-native/out

      - name: Install GHC and distribution Copilot libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc libghc-copilot-c99-dev libghc-copilot-language-dev libghc-copilot-libraries-dev
          ghc --version
          ghc-pkg list copilot

      - name: Type check full mapped and unmapped generated monitors
        shell: bash
        run: |
          mkdir -p research/fret-ogma-native/out/full-ghc
          set +e
          ghc -fforce-recomp -fno-code \
            research/fret-ogma-native/out/native/sensor-mapped/generated/Copilot.hs \
            > research/fret-ogma-native/out/full-ghc/mapped.log 2>&1
          mapped_code=$?
          ghc -fforce-recomp -fno-code \
            research/fret-ogma-native/out/native/sensor-unmapped/generated/Copilot.hs \
            > research/fret-ogma-native/out/full-ghc/unmapped.log 2>&1
          unmapped_code=$?
          set -e
          echo "mapped full-monitor GHC exit: $mapped_code"
          echo "unmapped full-monitor GHC exit: $unmapped_code"
          sed -n '1,90p' research/fret-ogma-native/out/full-ghc/mapped.log
          sed -n '1,90p' research/fret-ogma-native/out/full-ghc/unmapped.log
          test "$mapped_code" -eq 0
          test "$unmapped_code" -ne 0
          grep -q 'Found type wildcard' research/fret-ogma-native/out/full-ghc/unmapped.log

      - name: Preserve complete-monitor compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fret-ogma-full-monitor-ghc
          path: research/fret-ogma-native/out/full-ghc/
          if-no-files-found: warn

