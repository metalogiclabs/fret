name: Research - FRET Lift+Cruise via native NASA Ogma and Copilot

on:
  push:
    branches:
      - research/fret-lpc-monitor-bridge-20261117
    paths:
      - .github/workflows/research-fret-lpc-copilot-native.yml
      - research/fret_ogma_bridge.py
      - research/test_fret_ogma_bridge.py
      - research/fret_lpc_copilot_replay.c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_fret_ogma_copilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated research fork
        uses: actions/checkout@v4
        with:
          path: lab
          persist-credentials: false

      - name: Check out pinned NASA FRET source
        uses: actions/checkout@v4
        with:
          repository: NASA-SW-VnV/fret
          ref: cf0f913cc15c41705e803593297e89cd6056b839
          path: fret
          persist-credentials: false

      - name: Check out pinned NASA Ogma source
        uses: actions/checkout@v4
        with:
          repository: nasa/ogma
          ref: 1f8355712aba76b4047ccb4b1f4cead1b6cdb42a
          path: ogma-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test source selection and FRET JSON-shape contract
        run: python3 -m unittest discover -s lab/research -p test_fret_ogma_bridge.py -v

      - name: Extract exact pinned FRET source and typed contract for Ogma
        run: python3 lab/research/fret_ogma_bridge.py --fret fret --ogma ogma-source --out evidence/fret-ogma

      - name: Configure supported GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.14'

      - name: Install native Ogma prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libexpat1-dev z3 alex happy pkg-config zlib1g-dev binutils binutils-gold
          cabal update

      - name: Build pinned NASA Ogma CLI
        working-directory: ogma-source
        run: cabal build ogma-cli:exe:ogma --jobs=2

      - name: Translate pinned FRET historical property through Ogma
        working-directory: ogma-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/fret-ogma/copilot-generated
          cabal run ogma-cli:exe:ogma -- standalone \
            --input-format ogma-core/data/formats/fcs_lustre \
            --prop-format lustre \
            --input-file ../evidence/fret-ogma/LPC_REARPROP.fret-copilot.json \
            --target-dir ../evidence/fret-ogma/copilot-generated \
            2>&1 | tee ../evidence/fret-ogma/ogma.log
          test -f ../evidence/fret-ogma/copilot-generated/Copilot.hs
          grep -F 'rearprop' ../evidence/fret-ogma/copilot-generated/Copilot.hs
          grep -F 'hover_control_mode' ../evidence/fret-ogma/copilot-generated/Copilot.hs

      - name: Install pinned-major Copilot C99 libraries
        shell: bash
        run: |
          cabal v2-install --lib --jobs=2 --disable-optimization \
            copilot-4.7.1 copilot-c99-4.7.1 \
            copilot-language-4.7.1 copilot-libraries-4.7.1

      - name: Typecheck and generate Copilot C99 monitor
        shell: bash
        run: |
          set -euo pipefail
          ghc -fforce-recomp -fno-code evidence/fret-ogma/copilot-generated/Copilot.hs \
            2>&1 | tee evidence/fret-ogma/ghc.log
          (
            cd evidence/fret-ogma/copilot-generated
            runghc Copilot.hs 2>&1 | tee ../copilot-cgen.log
          )
          test -f evidence/fret-ogma/copilot-generated/monitor.c
          test -f evidence/fret-ogma/copilot-generated/monitor.h

      - name: Compile generated C99 monitor with independent replay harness
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -I evidence/fret-ogma/copilot-generated \
            lab/research/fret_lpc_copilot_replay.c \
            evidence/fret-ogma/copilot-generated/monitor.c \
            -o evidence/fret-ogma/native-replay
          for case in 0 1 2; do
            evidence/fret-ogma/native-replay "$case" | tee "evidence/fret-ogma/native-case-$case.log"
          done

      - name: Preserve native inputs, compiler outputs, verdicts and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fret-lpc-ogma-copilot-20261117
          path: evidence/fret-ogma/
          if-no-files-found: warn
          retention-days: 30
