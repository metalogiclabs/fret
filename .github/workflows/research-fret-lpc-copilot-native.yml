name: Research - FRET Lift+Cruise via native NASA Ogma and Copilot

on:
  push:
    branches:
      - research/fret-lpc-monitor-bridge-20261117
      - research/fret-ogma-lustre-control-20261118
      - research/fret-export-method-ogma-20261118
    paths:
      - .github/workflows/research-fret-lpc-copilot-native.yml
      - research/fret_ogma_bridge.py
      - research/test_fret_ogma_bridge.py
      - research/fret_lpc_copilot_replay.c
      - research/fret_export_method.cjs
      - research/run_fret_export_method.cjs
      - research/test_fret_export_method.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_fret_ogma_copilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated research fork
        uses: actions/checkout@v4
        with:
          path: lab
          persist-credentials: false

      - name: Check out pinned NASA FRET source
        uses: actions/checkout@v4
        with:
          repository: NASA-SW-VnV/fret
          ref: cf0f913cc15c41705e803593297e89cd6056b839
          path: fret
          persist-credentials: false

      - name: Check out pinned NASA Ogma source
        uses: actions/checkout@v4
        with:
          repository: nasa/ogma
          ref: 1f8355712aba76b4047ccb4b1f4cead1b6cdb42a
          path: ogma-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test source selection and FRET JSON-shape contract
        run: python3 -m unittest discover -s lab/research -p test_fret_ogma_bridge.py -v

      - name: Extract unchanged pinned FRET export and explicit Ogma dialect control
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/research/fret_ogma_bridge.py --fret fret --ogma ogma-source --out evidence/fret-ogma
          python3 lab/research/fret_ogma_bridge.py --fret fret --ogma ogma-source \
            --variant ogma-lustre-control --out evidence/fret-ogma/control
          test -f evidence/fret-ogma/LPC_REARPROP.fret-copilot.json
          test -f evidence/fret-ogma/control/LPC_REARPROP.ogma-lustre-control.json
          python3 -m json.tool evidence/fret-ogma/LPC_REARPROP.fret-copilot.json >/dev/null
          python3 -m json.tool evidence/fret-ogma/control/LPC_REARPROP.ogma-lustre-control.json >/dev/null
          sha256sum evidence/fret-ogma/LPC_REARPROP.fret-copilot.json \
            evidence/fret-ogma/control/LPC_REARPROP.ogma-lustre-control.json \
            | tee evidence/fret-ogma/input-sha256.log

      - name: Execute actual pinned FRET exportComponent method and compare source fields
        shell: bash
        env:
          FRET_SOURCE_DIR: ${{ github.workspace }}/fret
        run: |
          set -euo pipefail
          node --test lab/research/test_fret_export_method.cjs
          node lab/research/run_fret_export_method.cjs \
            --fret fret --out evidence/fret-ogma/method \
            --baseline evidence/fret-ogma/LPC_REARPROP.fret-copilot.json
          sha256sum evidence/fret-ogma/method/method-original.json \
            evidence/fret-ogma/method/method-control.json \
            evidence/fret-ogma/method/method-full-project.json \
            | tee evidence/fret-ogma/method/method-sha256.log

      - name: Configure supported GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.2.8'
          cabal-version: '3.14'

      - name: Install native Ogma prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libexpat1-dev z3 alex happy pkg-config zlib1g-dev binutils binutils-gold
          cabal update

      - name: Build pinned NASA Ogma CLI
        working-directory: ogma-source
        run: cabal build ogma-cli:exe:ogma --jobs=2

      - name: Negative control - test unchanged FRET formula against pinned Ogma grammar
        working-directory: ogma-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/fret-ogma/original-generated
          set +e
          cabal run ogma-cli:exe:ogma -- standalone \
            --input-format ogma-core/data/formats/fcs_lustre \
            --prop-format lustre \
            --input-file ../evidence/fret-ogma/LPC_REARPROP.fret-copilot.json \
            --target-dir ../evidence/fret-ogma/original-generated \
            > ../evidence/fret-ogma/ogma-original.log 2>&1
          status=$?
          set -e
          echo "Original Ogma exit: $status" | tee ../evidence/fret-ogma/original-exit.log
          if test "$status" -eq 0; then
            echo "Original was accepted: dialect hypothesis must be revisited"
            exit 1
          fi

          mkdir -p ../evidence/fret-ogma/method/original-generated
          set +e
          cabal run ogma-cli:exe:ogma -- standalone \
            --input-format ogma-core/data/formats/fcs_lustre \
            --prop-format lustre \
            --input-file ../evidence/fret-ogma/method/method-original.json \
            --target-dir ../evidence/fret-ogma/method/original-generated \
            > ../evidence/fret-ogma/method/ogma-original.log 2>&1
          method_status=$?
          set -e
          echo "Source-method Ogma exit: $method_status" | tee ../evidence/fret-ogma/method/original-exit.log
          if test "$method_status" -eq 0; then
            echo "Source-method original was accepted: dialect hypothesis must be revisited"
            exit 1
          fi

      - name: Positive control - translate equivalent Ogma-supported Boolean formula
        working-directory: ogma-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence/fret-ogma/control/copilot-generated
          cabal run ogma-cli:exe:ogma -- standalone \
            --input-format ogma-core/data/formats/fcs_lustre \
            --prop-format lustre \
            --input-file ../evidence/fret-ogma/control/LPC_REARPROP.ogma-lustre-control.json \
            --target-dir ../evidence/fret-ogma/control/copilot-generated \
            2>&1 | tee ../evidence/fret-ogma/ogma-control.log
          test -f ../evidence/fret-ogma/control/copilot-generated/Copilot.hs
          grep -F 'rearprop' ../evidence/fret-ogma/control/copilot-generated/Copilot.hs
          grep -F 'hover_control_mode' ../evidence/fret-ogma/control/copilot-generated/Copilot.hs

          mkdir -p ../evidence/fret-ogma/method/copilot-generated
          cabal run ogma-cli:exe:ogma -- standalone \
            --input-format ogma-core/data/formats/fcs_lustre \
            --prop-format lustre \
            --input-file ../evidence/fret-ogma/method/method-control.json \
            --target-dir ../evidence/fret-ogma/method/copilot-generated \
            2>&1 | tee ../evidence/fret-ogma/method/ogma-control.log
          test -f ../evidence/fret-ogma/method/copilot-generated/Copilot.hs
          grep -F 'rearprop' ../evidence/fret-ogma/method/copilot-generated/Copilot.hs
          grep -F 'hover_control_mode' ../evidence/fret-ogma/method/copilot-generated/Copilot.hs

      - name: Install pinned-major Copilot C99 libraries
        shell: bash
        run: |
          cabal v2-install --lib --jobs=2 --disable-optimization \
            copilot-4.7.1 copilot-c99-4.7.1 \
            copilot-language-4.7.1 copilot-libraries-4.7.1

      - name: Typecheck and generate Copilot C99 monitor
        shell: bash
        run: |
          set -euo pipefail
          ghc -fforce-recomp -fno-code evidence/fret-ogma/control/copilot-generated/Copilot.hs \
            2>&1 | tee evidence/fret-ogma/control/ghc.log
          (
            cd evidence/fret-ogma/control/copilot-generated
            runghc Copilot.hs 2>&1 | tee ../copilot-cgen.log
          )
          test -f evidence/fret-ogma/control/copilot-generated/monitor.c
          test -f evidence/fret-ogma/control/copilot-generated/monitor.h
          ghc -fforce-recomp -fno-code evidence/fret-ogma/method/copilot-generated/Copilot.hs \
            2>&1 | tee evidence/fret-ogma/method/ghc.log
          (
            cd evidence/fret-ogma/method/copilot-generated
            runghc Copilot.hs 2>&1 | tee ../copilot-cgen.log
          )
          test -f evidence/fret-ogma/method/copilot-generated/monitor.c
          test -f evidence/fret-ogma/method/copilot-generated/monitor.h

      - name: Compile generated C99 monitor with independent replay harness
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -I evidence/fret-ogma/control/copilot-generated \
            lab/research/fret_lpc_copilot_replay.c \
            evidence/fret-ogma/control/copilot-generated/monitor.c \
            -o evidence/fret-ogma/control/native-replay
          for case in 0 1 2; do
            evidence/fret-ogma/control/native-replay "$case" \
              | tee "evidence/fret-ogma/control/native-case-$case.log"
          done
          gcc -std=c99 -Wall -Wextra -Werror -pedantic \
            -I evidence/fret-ogma/method/copilot-generated \
            lab/research/fret_lpc_copilot_replay.c \
            evidence/fret-ogma/method/copilot-generated/monitor.c \
            -o evidence/fret-ogma/method/native-replay
          for case in 0 1 2; do
            evidence/fret-ogma/method/native-replay "$case" \
              | tee "evidence/fret-ogma/method/native-case-$case.log"
          done

      - name: Preserve native inputs, compiler outputs, verdicts and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fret-lpc-ogma-copilot-20261117
          path: evidence/fret-ogma/
          if-no-files-found: warn
          retention-days: 30
